[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "chat-bricks"
version = "0.1.4"
description = "A helper library for LLM/VLM chat templates."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["chat", "template"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
]

dependencies=[
    "transformers",
    "termcolor",
    "Pillow",
    "requests",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
train = [
    "torch",
]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "mkdocs-git-revision-date-localized-plugin>=1.2",
    "mkdocs-git-authors-plugin>=0.7",
    "mkdocs-macros-plugin>=1.2",
    "mkdocstrings[python]>=0.27",
    "mkdocs-autorefs>=1.0",
    "mike>=2.1",
]
